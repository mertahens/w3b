# w3b configuration.
#
# Colors accept: terminal names (black red green yellow blue magenta cyan gray
# dark_gray light_red ... ), an indexed color ("0".."255"), a hex color
# ("#1e1e2e"), or "default" / "reset" / "none" for the terminal default.
#
# Every style block takes: fg, bg, bold, italic, underline, reverse, dim.
# The page's own CSS colors are never read - all colors here.

[style]

# --- page content ---------------------------------------------------------
[style.text]
fg = "default"

[style.link]
fg = "blue"
underline = true

[style.visited]
fg = "magenta"
underline = true

# A link that leaves this site: where it goes rather than where you have been.
[style.external]
fg = "cyan"
underline = true

[style.heading]
fg = "light_green"
bold = true

[style.strong]
bold = true

[style.emphasis]
italic = true

[style.code]
fg = "green"

[style.muted]
fg = "dark_gray"

[style.divider]
fg = "dark_gray"

[style.placeholder]
fg = "yellow"
italic = true

# Elements that ask for a monospace font (code, pre, kbd, a monospace
# font-family). The colours cover the text plus one blank cell of padding on each
# side - a dark slab with light text, so code stands out from the prose around it.
[style.monospace]
fg = "#d0d0d0"
bg = "#141414"

# The summary line of a <details> is something to open, not somewhere to go, so
# it does not wear the link color: the normal text color, underlined, with a +
# or - in front of it.
[style.disclosure]
underline = true

# The parts of a JSON body, painted over the monospace slab. Braces, commas and
# colons are structure rather than content and take [style.muted].
[style.json_key]
fg = "light_blue"

[style.json_string]
fg = "green"

[style.json_number]
fg = "yellow"

[style.json_literal]
fg = "light_cyan"

# Image placeholders, labelled with whatever the image says about itself.
[style.image]
fg = "black"
bg = "magenta"
italic = true

# The same placeholder inside a link: it stays black ink, only underlined, rather
# than turning link-blue.
[style.linked_image]
fg = "black"
underline = true

# The link the cursor is standing on, drawn under the cursor cell.
# The link under the cursor: the link colour moves from the ink to the background.
[style.hovered_link]
fg = "black"
bg = "blue"

# --- cursor ---------------------------------------------------------------
# cursor_line tints the whole row the cursor sits on; cursor is the cell.
[style.cursor_line]
bg = "#2b2b3b"

[style.cursor]
bg = "yellow"
fg = "black"
bold = true

# --- search / prompts -----------------------------------------------------
# A search hit: a grey band with dark glyphs, so a hit reads as a mark on the
# page rather than as a link or as selected text.
[style.search_match]
bg = "gray"
fg = "black"

# Text marked with v or V, or with the mouse, waiting for y. A band of light on dark glyphs: brighter
# than a search hit, so the mark reads as "this is what y will take".
[style.selection]
bg = "light_gray"
fg = "black"

[style.prompt]
fg = "default"

[style.message]
fg = "cyan"

# --- status line ----------------------------------------------------------
[style.status]
fg = "black"
bg = "dark_gray"

[style.status.loading]
fg = "black"
bg = "yellow"

[style.status.ok]
fg = "black"
bg = "green"

[style.status.redirect]
fg = "black"
bg = "cyan"

[style.status.client_error]
fg = "white"
bg = "red"

[style.status.server_error]
fg = "white"
bg = "light_red"

[style.status.error]
fg = "white"
bg = "red"
bold = true

# Exact status codes win over the class above.
[style.status.codes."404"]
fg = "white"
bg = "magenta"

# --- status line segments -------------------------------------------------
[style.url]
fg = "default"
bold = true

[style.title]
fg = "default"

[style.position]
fg = "default"
bold = true

[style.scrollbar]
fg = "dark_gray"

[style.border]
fg = "dark_gray"

[behavior]
home_url = "https://example.com"
user_agent = "w3b/0.1 (text mode browser)"
timeout_secs = 15
max_redirects = 10
max_response_bytes = 8388608
scroll_margin = 3
tab_width = 4
wrap = true
show_title_in_status = true
show_scrollbar = false
mouse = true
case_insensitive_search = true
history_size = 200
# Blank columns kept between the terminal edge and the page text.
page_padding_x = 1
# Copy what was yanked - a link target, a media address, the page url - to the
# terminal clipboard with an OSC 52 escape.
yank_to_clipboard = true

# Embedded and linked stylesheets are applied: display: none and visibility:
# hidden drop elements, font-family: monospace marks code. This caps how many
# linked sheets are fetched. 0 fetches none.
max_stylesheets = 4
# Show how long the page took to fetch, on the right of the status line.
show_load_time = true
# Show how big the body was, next to the time: `412 B`, `18.2 kB`, `1.4 MB`.
show_size = true
