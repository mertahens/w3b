[package]
name = "w3b"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A vim-like text-mode web browser"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "7"
encoding_rs = "0.8"
chardetng = "1"
http = "1"
ratatui = "0.30"
regex = "1"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
ureq = { version = "3.5", features = ["gzip", "brotli"] }

[dev-dependencies]
insta = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
